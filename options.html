<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMC Truck Shipping Banner Fix Standalone Configuration Options</title>
    <link rel="stylesheet" href="options.css" type="text/css">
</head>
<body>
    <div class="content">
    <span>
        <label>
            <input type="checkbox" id="vBoolUxTruckBannerFix">
            Fix "Unexpected Error" banner when shipping a truck.
            <span class="tooltip">
                <svg class="tooltipicon" width="16" height="16" viewBox="0 0 24 24" fill="#faf4a5" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="16" x2="12" y2="12"></line>
                    <line x1="12" y1="8" x2="12" y2="8"></line>
                </svg>
                <span class="tooltiptext tooltipimportant">
                    This occurs inconsistently when shipping a truck that has issues that would normally cause a warning.<br>
                    I.E. PPAP missing/expired, customer on credit hold.<br>
                    This should override the broken function to show the actual warning instead of an unexpected error.<br><br>
                    If you disable this, the extension does nothing.
                </span>
            </span>
        </label>
    </span>
    <div class="bottom-panel">
        <span class="status-message" id="statusMessage"></span>
        <button class="save-button" id="saveButton">Save</button>
    </div>
    <script type="module" src="options.js"></script>
    <script type="module" src="config.js"></script>
</body>
</html>
